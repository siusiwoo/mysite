<html layout:decorate="~{layout}">
	<div class="container" layout:fragment="content">
			<div class="row">
				<div class="col">
					<div class="jumbotron">
						<h1>질문 등록</h1>
					</div>	
			<form  method="post" th:object="${questionForm}">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<div th:replace="~{form_errors}"></div>					
					  <div class="form-group">
					    <label for="subject">제목</label>
					    <input th:field="*{subject}" type="text" class="form-control"  aria-describedby="emailHelp">
					  </div>
					  <div class="form-group">
					    <label for="content">내용</label>
						<textarea th:field="*{content}"  cols="30" rows="10" class="form-control"></textarea>
					  </div>
					  <button type="submit" class="btn btn-primary">저장하기</button>
					</form>
				</div>
			</div>
		</div>
</html>
