<html layout:decorate="~{layout}">
<div class="container" layout:fragment="content">
	
	<div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
	  <div class="carousel-inner">
	    <div class="carousel-item active">
	      <img th:src="@{/imgs/from.png}" class="d-block w-100" style="height: 500px"; alt="...">
	    </div>
	    <div class="carousel-item">
	      <img th:src="@{/imgs/from2.png}" class="d-block w-100" style="height: 500px"; alt="...">
	    </div>
	    <div class="carousel-item">
	      <img th:src="@{/imgs/from3.png}" class="d-block w-100"style="height: 500px"; alt="...">
	    </div>
	  </div>
	 <button class="carousel-control-prev" type="button" data-target="#carouselExampleControls" data-slide="prev">
	    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
	    <span class="sr-only">Previous</span>
	  </button>
	  <button class="carousel-control-next" type="button" data-target="#carouselExampleControls" data-slide="next">
	    <span class="carousel-control-next-icon" aria-hidden="true"></span>
	    <span class="sr-only">Next</span>
	  </button>
	</div>
		
</div>
</html>
